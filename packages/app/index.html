<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cutplane</title>
    <style>
      :root {
        --panel: rgba(28, 29, 34, 0.82);
        --ink: #f3ece6;
        --dim: #b9aea6;
        --accent: #00e5e5;
        font:
          13px/1.4 ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1c1d22;
        color: var(--ink);
        -webkit-user-select: none;
        user-select: none;
      }
      #app {
        position: fixed;
        inset: 0;
        background: #1c1d22;
      }
      #viewport {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        cursor: none;
        touch-action: none;
      }
      .panel {
        position: absolute;
        background: var(--panel);
        border-radius: 8px;
        padding: 8px 10px;
        backdrop-filter: blur(6px);
      }
      #hud {
        top: 12px;
        left: 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        max-width: calc(100% - 48px);
      }
      #hud strong {
        letter-spacing: 0.04em;
        margin-right: 4px;
      }
      #hud select,
      #hud button,
      #pause button {
        font: inherit;
        color: var(--ink);
        background: #34363e;
        border: 1px solid #4a4c55;
        border-radius: 6px;
        padding: 3px 8px;
      }
      #hud button.primary,
      #pause button.primary {
        background: #0b6f6f;
        border-color: #13a0a0;
      }
      /* Only "Export…" shows when closed: not as wide as its longest format's name. */
      #hud #export {
        width: 7em;
      }
      /* Files dragged over the page: it will take them. */
      #app.dropping::after {
        content: 'Drop to open: .cut worlds, or OBJ, STL, glTF, Inventor, VRML and DXF models to add';
        position: absolute;
        inset: 12px;
        display: grid;
        place-items: center;
        border: 2px dashed var(--accent);
        border-radius: 12px;
        color: var(--accent);
        font-size: 18px;
        background: rgba(0, 0, 0, 0.35);
        pointer-events: none;
      }
      #pause {
        inset: 0;
        border-radius: 0;
        display: none;
        place-items: center;
        background: rgba(0, 0, 0, 0.45);
        text-align: center;
      }
      #pause.shown {
        display: grid;
      }
      #pause p {
        margin: 0 0 12px;
        font-size: 16px;
      }
      /* Working, nothing flat sits over the room: no toolbar. */
      .working #hud,
      .demo #hud {
        display: none;
      }
      /* The CPL editor (outside work mode only). */
      #code {
        top: 64px;
        right: 12px;
        bottom: 84px;
        width: min(560px, calc(100% - 48px));
        display: none;
        flex-direction: column;
        gap: 6px;
        -webkit-user-select: text;
        user-select: text;
      }
      #code.shown {
        display: flex;
      }
      .working #code,
      .demo #code {
        display: none !important;
      }
      #code .row {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      #code select {
        flex: 1;
      }
      #code select,
      #code button {
        font: inherit;
        color: var(--ink);
        background: #34363e;
        border: 1px solid #4a4c55;
        border-radius: 6px;
        padding: 3px 8px;
      }
      #code .info {
        color: var(--dim);
      }
      #code textarea {
        flex: 1;
        resize: none;
        tab-size: 8;
        font:
          12px/1.35 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        color: var(--ink);
        background: #121317;
        border: 1px solid #4a4c55;
        border-radius: 6px;
        padding: 8px;
        white-space: pre;
      }
      #code .errors {
        white-space: pre-wrap;
        color: #8fe08f;
        min-height: 1.4em;
        max-height: 6em;
        overflow: auto;
      }
      #code .errors.bad {
        color: #ff8a80;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="viewport"></canvas>
      <div id="hud" class="panel">
        <strong>CUTPLANE</strong>
        <select id="model" aria-label="Model"></select>
        <select id="planeStyle" aria-label="Plane style">
          <option value="classic">Stippled plane</option>
          <option value="modern">Translucent plane</option>
        </select>
        <select id="faceDrag" aria-label="Face drag" title="What dragging a face does">
          <option value="stretch">Faces stretch</option>
          <option value="extrude">Faces extrude</option>
        </select>
        <select
          id="groupPick"
          aria-label="Group pick"
          title="What clicking a part of a group picks"
        >
          <option value="whole">Groups pick whole</option>
          <option value="parts">Groups pick by part</option>
        </select>
        <select
          id="planeStick"
          aria-label="Plane stickiness"
          title="How far you push the plane before it comes off a face parallel to it"
        >
          <option value="0">Faces don't stick</option>
          <option value="5">Faces stick a little</option>
          <option value="15">Faces stick</option>
          <option value="30">Faces stick firmly</option>
        </select>
        <button
          id="open"
          title="Open a .cut world, or add OBJ, STL, glTF, Inventor, VRML or DXF models to this one (or drop files on the page)"
        >
          Open…
        </button>
        <button
          id="save"
          title="Save the world, with its objects' CPL, as a .cut file (a copy stays in this browser, in the model menu)"
        >
          Save
        </button>
        <select id="export" aria-label="Export" title="The world's objects as a mesh file">
          <option value="">Export…</option>
        </select>
        <button id="codeButton" title="The CPL the world runs, live">Code</button>
        <input id="file" type="file" multiple hidden />
        <button id="work" class="primary" title="Full screen with the pointer captured (F)">
          Start working (F)
        </button>
      </div>
      <div id="code" class="panel" aria-label="CPL editor">
        <div class="row">
          <select aria-label="Code to show"></select>
          <button class="apply" title="Apply (⌘↵ / Ctrl+↵)">Apply</button>
          <button class="close" title="Close">✕</button>
        </div>
        <div class="info"></div>
        <textarea spellcheck="false" aria-label="CPL code"></textarea>
        <div class="errors"></div>
      </div>
      <div id="pause" class="panel">
        <div>
          <p>Paused — the pointer was released.</p>
          <button id="resume" class="primary">Click to resume</button>
          <button id="leave">Leave work mode</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
