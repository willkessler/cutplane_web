<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cutplane</title>
    <style>
      :root {
        --panel: rgba(28, 29, 34, 0.82);
        --ink: #f3ece6;
        --dim: #b9aea6;
        --accent: #00e5e5;
        font:
          13px/1.4 ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1c1d22;
        color: var(--ink);
        -webkit-user-select: none;
        user-select: none;
      }
      #app {
        position: fixed;
        inset: 0;
        background: #1c1d22;
      }
      #viewport {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        cursor: none;
        touch-action: none;
      }
      .panel {
        position: absolute;
        background: var(--panel);
        border-radius: 8px;
        padding: 8px 10px;
        backdrop-filter: blur(6px);
      }
      #hud {
        top: 12px;
        left: 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        max-width: calc(100% - 48px);
      }
      #hud strong {
        letter-spacing: 0.04em;
        margin-right: 4px;
      }
      #hud select,
      #hud button,
      #pause button {
        font: inherit;
        color: var(--ink);
        background: #34363e;
        border: 1px solid #4a4c55;
        border-radius: 6px;
        padding: 3px 8px;
      }
      #hud button.primary,
      #pause button.primary {
        background: #0b6f6f;
        border-color: #13a0a0;
      }
      #status {
        bottom: 12px;
        left: 12px;
        right: 12px;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 4px 16px;
        color: var(--dim);
        pointer-events: none;
      }
      #status b {
        color: var(--ink);
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      #hints span + span::before {
        content: ' · ';
      }
      #pause {
        inset: 0;
        border-radius: 0;
        display: none;
        place-items: center;
        background: rgba(0, 0, 0, 0.45);
        text-align: center;
      }
      #pause.shown {
        display: grid;
      }
      #pause p {
        margin: 0 0 12px;
        font-size: 16px;
      }
      /* Working, nothing flat sits over the room: no toolbar, no status bar. */
      .working #hud,
      .working #status {
        display: none;
      }
      .demo #hud,
      .demo #status {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="viewport"></canvas>
      <div id="hud" class="panel">
        <strong>CUTPLANE</strong>
        <select id="model" aria-label="Model"></select>
        <select id="profile" aria-label="Input profile"></select>
        <select id="planeStyle" aria-label="Plane style">
          <option value="classic">Stippled plane</option>
          <option value="modern">Translucent plane</option>
        </select>
        <button id="work" class="primary" title="Full screen with the pointer captured (Enter)">
          Start working ⏎
        </button>
      </div>
      <div id="status" class="panel">
        <div id="readout"></div>
        <div id="hints"></div>
      </div>
      <div id="pause" class="panel">
        <div>
          <p>Paused — the pointer was released.</p>
          <button id="resume" class="primary">Click to resume</button>
          <button id="leave">Leave work mode</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
