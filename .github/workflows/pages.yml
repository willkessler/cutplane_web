name: Pages

# Publishes the static site to GitHub Pages on every push to main:
# https://willkessler.github.io/cutplane_web/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      # Built inside the project's dev image, as CI does.
      - run: docker compose build dev
      - run: docker compose run --rm dev pnpm install --frozen-lockfile
      - run: docker compose run --rm -e BASE_PATH=/${{ github.event.repository.name }}/ dev pnpm build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: packages/app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
