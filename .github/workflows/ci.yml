name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every install, build and test runs inside the project's Docker images.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose build dev
      - run: docker compose run --rm dev pnpm install --frozen-lockfile
      - run: docker compose run --rm dev pnpm check

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose run --rm e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f docker/Dockerfile -t cutplane-web .
      - name: Smoke-test the production image
        run: |
          docker run -d --name web -e PORT=9000 -p 9000:9000 cutplane-web
          for i in $(seq 1 20); do curl -fsS http://localhost:9000/ | grep -q '<title>Cutplane</title>' && exit 0; sleep 1; done
          docker logs web; exit 1
